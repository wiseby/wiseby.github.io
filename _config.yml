# ============================================================================
# Site settings
# ============================================================================
# This site is split into two purpose-named sections rather than by language:
#
#   /business/  - English, technical, consulting work
#   /verkstaden/  - Swedish, hobby: DIY, event, artiklar
#
# Section identity is derived from the URL prefix in _includes/masthead.html,
# so no page needs front matter to know which section it belongs to.
#
# NOTE: this file is *NOT* reloaded by `jekyll serve`. Restart after editing.

title: Wiseby @ Github
masthead_title: Wiseby
description: >-
  Technical consulting, and a workshop full of side projects.
email: l.wiseby@gmail.com
locale: en-US

minimal_mistakes_skin: default
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# The theme and its vendored susy/breakpoint libraries raise a few hundred Sass
# deprecation warnings. quiet_deps hides the ones coming from dependencies so
# our own output stays readable. A couple of @import warnings from the theme's
# entry point still show through; those are upstream's to fix, not ours.
sass:
  quiet_deps: true

# Outputting
# /:categories/:title/ is what gives section-scoped post URLs for free:
#   categories: [business, articles] -> /business/articles/:title/
#   categories: [verkstad, artiklar] -> /verkstaden/artiklar/:title/
permalink: /:categories/:title/
timezone: Europe/Stockholm

include:
  - _pages

# ============================================================================
# Collections - content that is not blog-shaped
# ============================================================================
collections:
  services:
    output: true
    permalink: /business/services/:name/
  diy:
    output: true
    permalink: /verkstaden/gor-det-sjalv/:name/
  events:
    output: true
    permalink: /verkstaden/event/:name/

# One feed per section, in addition to the combined /feed.xml.
# jekyll-feed emits /feed/business.xml and /feed/verkstad.xml.
feed:
  categories:
    - business
    - verkstaden

# Plugins
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Lucas Wiseby"
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Developer and tinkerer. Swedish workshop content lives over in Verkstad."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/wiseby"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/wiseby"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # Collections
  - scope:
      path: ""
      type: services
    values:
      layout: single
      author_profile: true
      share: false
  - scope:
      path: ""
      type: diy
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
      type: events
    values:
      layout: single
      author_profile: true
      share: true
